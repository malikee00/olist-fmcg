services:
  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: olist-airflow-webserver
    restart: unless-stopped
    depends_on:
      - airflow-postgres

    env_file:
      - .env

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"

      PROJECT_ROOT: /opt/project
      PYTHONUNBUFFERED: "1"

      # Azure Postgres (dipakai oleh wrapper load_supabase.sh)
      AZURE_DB_HOST: ${AZURE_DB_HOST}
      AZURE_DB_PORT: ${AZURE_DB_PORT}
      AZURE_DB_NAME: ${AZURE_DB_NAME}
      AZURE_DB_USER: ${AZURE_DB_USER}
      AZURE_DB_PASSWORD: ${AZURE_DB_PASSWORD}
      AZURE_DB_SSLMODE: ${AZURE_DB_SSLMODE}
      AZURE_DB_SCHEMA: ${AZURE_DB_SCHEMA}

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/project
      - airflow_logs:/opt/airflow/logs

    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    container_name: olist-airflow-scheduler
    restart: unless-stopped
    depends_on:
      - airflow-postgres

    env_file:
      - .env

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"

      PROJECT_ROOT: /opt/project
      PYTHONUNBUFFERED: "1"

      AZURE_DB_HOST: ${AZURE_DB_HOST}
      AZURE_DB_PORT: ${AZURE_DB_PORT}
      AZURE_DB_NAME: ${AZURE_DB_NAME}
      AZURE_DB_USER: ${AZURE_DB_USER}
      AZURE_DB_PASSWORD: ${AZURE_DB_PASSWORD}
      AZURE_DB_SSLMODE: ${AZURE_DB_SSLMODE}
      AZURE_DB_SCHEMA: ${AZURE_DB_SCHEMA}

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/plugins:/opt/airflow/plugins
      - ./:/opt/project
      - airflow_logs:/opt/airflow/logs

    command: scheduler

  airflow-postgres:
    image: postgres:15
    container_name: olist-airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_db:/var/lib/postgresql/data

volumes:
  airflow_logs:
  airflow_db:
